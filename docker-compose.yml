name: shipping-on-the-air

services:
  order-service:
    image: shipping-order-service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-01
    networks:
      - shipping_network
    ports:
      - "8090:8090"
    expose:
      - 8090
    environment:
      - DELIVERY_HOST=delivery-service
      - DELIVERY_PORT=8091
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  delivery-service:
    image: shipping-delivery-service
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    container_name: delivery-01
    networks:
      - shipping_network
    ports:
      - "8091:8091"
    expose:
      - 8091
    environment:
      - DRONE_HOST=drone-service
      - DRONE_PORT=8092
      - ORDER_HOST=order-service
      - ORDER_PORT=8090
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  drone-service:
    image: shipping-drone-service
    build:
      context: .
      dockerfile: drone-service/Dockerfile
    container_name: drone-01
    networks:
      - shipping_network
    ports:
      - "8092:8092"
    expose:
      - 8092
    environment:
      - DELIVERY_HOST=delivery-service
      - DELIVERY_PORT=8091
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  api-gateway:
    image: shipping-api-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: gateway-01
    networks:
      - shipping_network
    ports:
      - "8080:8080"
    expose:
      - 8080
    environment:
      - ORDER_HOST=order-service
      - ORDER_PORT=8090
      - DELIVERY_HOST=delivery-service
      - DELIVERY_PORT=8091
      - DRONE_HOST=drone-service
      - DRONE_PORT=8092
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  shipping_network:
